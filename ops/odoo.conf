# Odoo configuration for the docker-compose dev stack.
#
# Mounted read-only at /etc/odoo/odoo.conf. addons_path is NOT set here:
# ops/odoo-entrypoint.sh derives the core addons directory from the installed
# Odoo package and appends our paths, because the right value differs between
# Odoo releases and install methods. Hardcoding it here is what produces
# "module not found: hr.payslip" during a first install.
#
# This file is committed and contains no secrets: the database password arrives
# through environment variables.

[options]
admin_passwd = admin
db_host = postgres
db_port = 5432
db_user = odoo
; db_password is supplied via the PASSWORD environment variable.
list_db = True
; demo data is explicitly disabled by the install script
; (--without-demo=all); left off here so `docker compose up` alone is usable
; for a look around.
without_demo = all
http_interface = 0.0.0.0
; Test runs must not have background cron threads racing the suite.
max_cron_threads = 0
limit_time_cpu = 3600
limit_time_real = 3600
workers = 0
; Keep the log readable; the install script overrides --log-level as needed.
log_level = info
